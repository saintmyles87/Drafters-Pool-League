<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drafters Pool League</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    .border-qualify-semi { border-left: 4px solid #f59e0b; }
    .border-qualify-direct-final { border-left: 4px solid #10b981; }
    .border-qualify-playoff { border-left: 4px solid #3b82f6; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans">

  <!-- Header & Navigation -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="text-base font-black tracking-wider text-amber-400 uppercase">Drafters Pool League</h1>
    </div>
    <!-- Navigation Tabs -->
    <nav class="max-w-xl mx-auto flex gap-1 mt-3 border-b border-slate-800 text-xs">
      <button id="tab-tournament" onclick="switchTab('tournament')" class="tab-btn py-2 px-3 border-b-2 border-amber-400 text-amber-400 font-bold">Tournament</button>
      <button id="tab-championship" onclick="switchTab('championship')" class="tab-btn py-2 px-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200">Championship</button>
      <button id="tab-cumulative" onclick="switchTab('cumulative')" class="tab-btn py-2 px-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200">Cumulative</button>
      <button id="tab-h2h" onclick="switchTab('h2h')" class="tab-btn py-2 px-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200">H2H</button>
    </nav>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- 1. TOURNAMENT TAB -->
    <section id="sec-tournament" class="tab-content space-y-4">

      <!-- Tournament Sub-tabs / Selector (T1, T2, T3...) -->
      <div id="tourney-selector-container"></div>

      <!-- Top 3 Podium Summary Banner -->
      <div id="top-3-podium"></div>

      <!-- Attendance Setup Card -->
      <div id="attendance-card" class="bg-slate-900/90 p-4 rounded-lg border border-slate-800">
        <h2 class="text-sm font-bold text-amber-400 mb-2">New Tournament Setup</h2>
        <p class="text-xs text-slate-400 mb-3">Select attending players (4-6):</p>
        <div id="player-checkboxes" class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-4"></div>
        <button onclick="generateFixtures()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded text-xs transition-colors">
          Start Tournament
        </button>
      </div>

      <!-- Round Robin Table Card -->
      <div id="tournament-table-card" class="bg-slate-900/90 p-3 rounded-lg border border-slate-800 hidden">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-xs font-bold text-amber-400">Round Robin Standings</h3>
          <span id="player-count-badge" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left text-slate-300">
            <thead>
              <tr class="border-b border-slate-800 text-[10px] text-slate-400">
                <th class="p-1.5">#</th>
                <th class="p-1.5">Player</th>
                <th class="p-1.5 text-center">P</th>
                <th class="p-1.5 text-center text-emerald-400">W</th>
                <th class="p-1.5 text-center text-rose-400">L</th>
                <th class="p-1.5 text-right text-amber-400 font-bold">Pts</th>
              </tr>
            </thead>
            <tbody id="tbl-tournament"></tbody>
          </table>
        </div>
      </div>

      <!-- Fixtures List Card -->
      <div id="fixtures-card" class="hidden">
        <div id="list-fixtures"></div>
      </div>

      <!-- Knockout Playoffs Card -->
      <div id="playoffs-card" class="bg-slate-900/90 p-3 rounded-lg border border-slate-800 hidden"></div>

    </section>

    <!-- 2. CHAMPIONSHIP TAB -->
    <section id="sec-championship" class="tab-content hidden"></section>

    <!-- 3. CUMULATIVE TAB -->
    <section id="sec-cumulative" class="tab-content hidden"></section>

    <!-- 4. HEAD-TO-HEAD TAB -->
    <section id="sec-h2h" class="tab-content hidden space-y-4">
      <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
        <h3 class="text-xs font-bold text-amber-400 mb-3">Head-to-Head Stats</h3>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Player 1</label>
            <select id="h2h-p1" onchange="renderH2H()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-100"></select>
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Player 2</label>
            <select id="h2h-p2" onchange="renderH2H()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-100"></select>
          </div>
        </div>
        <div id="h2h-result-card" class="space-y-2"></div>
      </div>
    </section>

  </main>

  <!-- Edit Score Modal -->
  <div id="modal-edit" class="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 w-full max-w-xs space-y-4">
      <h3 class="text-sm font-bold text-amber-400">Enter Match Result</h3>
      <div id="modal-edit-body" class="space-y-3"></div>
      <div class="flex gap-2">
        <button onclick="closeModal()" class="w-1/2 bg-slate-800 text-slate-300 py-2 rounded text-xs font-bold">Cancel</button>
        <button id="btn-save-edit" class="w-1/2 bg-amber-500 text-slate-950 py-2 rounded text-xs font-bold">Save Score</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
